<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Fitness Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      color: #cbd5e1;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .status {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(71, 85, 105, 0.5);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s;
    }
    .button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. Puedes seguir usando los datos que ya hemos guardado en tu dispositivo.</p>
    
    <div class="status">
      <span class="dot"></span>
      <span>Esperando conexión...</span>
    </div>
    
    <p style="font-size: 14px; color: #94a3b8;">
      Una vez recuperes la conexión, los datos se sincronizarán automáticamente.
    </p>
    
    <button class="button" onclick="location.href='/'">
      Volver al inicio
    </button>
  </div>

  <script>
    // Detectar cuando vuelve la conexión
    window.addEventListener('online', () => {
      console.log('Conexión recuperada');
      location.reload();
    });
  </script>
</body>
</html>
